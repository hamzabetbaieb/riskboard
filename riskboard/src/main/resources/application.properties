spring.application.name=riskboard
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/riskboard}
spring.datasource.username=${DB_USERNAME:riskboard}
spring.datasource.password=${DB_PASSWORD:riskboard}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
