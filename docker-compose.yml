services:
  postgres:
    image: postgres:17-alpine
    container_name: riskboard-postgres
    environment:
      POSTGRES_DB: riskboard
      POSTGRES_USER: riskboard
      POSTGRES_PASSWORD: riskboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskboard -d riskboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
